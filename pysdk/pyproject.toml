[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "pysdk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioautobatch>=0.1.2",
    "aiofiles>=25.1.0",
    "grpcio>=1.76.0",
    "httpx>=0.28.1",
    "protobuf>=6.33.5",
    "pydantic>=2.12.5",
    "types-protobuf>=6.32.1.20251210",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_envs"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "build_hooks.py"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
lint = [
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 120
